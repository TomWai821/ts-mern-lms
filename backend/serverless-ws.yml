service: book-management-system-ws

frameworkVersion: '3'

plugins:
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-east-1
  stage: production

  environment:
    REMOVE_RUNTIME_STRIP: "false"
    AWS_REGION: ${self:provider.region}
    MONGO_URI: ${env:MONGO_URI, ''}
    PORT: 5000
    RUNTIME_ENV: AWS
    STORAGE_TYPE: S3
    WS_CONNECTION_TABLE_NAME: ${self:custom.wsConnectionTableName}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - execute-api:ManageConnections
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.wsConnectionTableName}"
            - "arn:aws:execute-api:${self:provider.region}:*:*/${self:provider.stage}/POST/@connections/*"

custom:
  wsConnectionTableName: websocket-connections-${self:provider.stage}

package:
  individually: true
  patterns:
    - '!src/**'
    - '!tsconfig*.json'
    - 'dist/**'
    - 'node_modules/**'

functions:
  websocket:
    handler: dist/init/connectToDynamoDB.wsHandler
    events:
      - websocket:
          route: $connect
      - websocket:
          route: $disconnect
      - websocket:
          route: $default

resources:
  Resources:
    WebSocketConnectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.wsConnectionTableName}
        AttributeDefinitions:
          - AttributeName: connectionId
            AttributeType: S
        KeySchema:
          - AttributeName: connectionId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST