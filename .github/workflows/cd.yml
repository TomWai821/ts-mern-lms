name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build TS
        run: |
          npm ci --prefix backend
          npm run build --prefix backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy WebSocket & API sequentially
        working-directory: ./backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          npx serverless@3 deploy --config serverless-ws.yml
          npx serverless@3 deploy --config serverless-api.yml

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: ${{ needs.deploy-backend.result == 'success' }}
    steps:
      - name: Trigger Vercel Deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST "${VERCEL_DEPLOY_HOOK}")
          RESPONSE_BODY=$(cat response.json || true)
          echo "Vercel HTTP Code: $HTTP_CODE"
          echo "Vercel Response: $RESPONSE_BODY"
          if [ "$HTTP_CODE" -eq 201 ] || [ "$HTTP_CODE" -eq 200 ]; then
            echo "Vercel deployment triggered successfully!"
          else
            echo "Error: Vercel API failed with status $HTTP_CODE"
            exit 1
          fi