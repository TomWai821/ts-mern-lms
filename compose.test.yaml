services:
  backend-test:
    build:
      context: ./backend
      target: test
    environment:
      MONGO_URI: mongodb://mongo:27017/test
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    depends_on:
      mongo:
        condition: service_healthy
      dynamodb:
        condition: service_started
    volumes:
      - ./backend/coverage:/app/coverage

  frontend-test:
    build:
      context: ./frontend
      target: test

  mongo:
    image: mongo:6.0
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: 
      - db-data:/data/db
      - ./backend/MongoDBSeed:/docker-entrypoint-initdb.d

  dynamodb:
    image: amazon/dynamodb-local

volumes:
  db-data: